<svg width="1000" height="280" viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg" style="background-color: transparent; font-family: 'Inter', -apple-system, sans-serif;">
  <defs>
    <!-- Neons -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#005c8a" />
    </linearGradient>
    <linearGradient id="neonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcc00" />
      <stop offset="100%" stop-color="#b38f00" />
    </linearGradient>
    <linearGradient id="neonGray" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8892b0" />
      <stop offset="100%" stop-color="#0a192f" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00d2ff"/>
    </marker>
  </defs>

  <!-- Left Node: WebGPU -->
  <g transform="translate(40, 100)">
    <rect width="200" height="80" rx="12" fill="#0b0f19" stroke="url(#neonCyan)" stroke-width="2" filter="url(#glowCyan)"/>
    <text x="100" y="38" fill="#e2e8f0" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="1">Liquid Glass Front</text>
    <text x="100" y="58" fill="#64ffda" font-size="12" font-weight="500" text-anchor="middle">React Three Fiber</text>
  </g>

  <!-- Center Node: Rust Daemon -->
  <g transform="translate(390, 80)">
    <rect width="220" height="120" rx="12" fill="#0b0f19" stroke="url(#neonGold)" stroke-width="2"/>
    <!-- Subtle diamond shape background -->
    <path d="M 110 0 L 220 60 L 110 120 L 0 60 Z" fill="none" stroke="#ffcc00" stroke-width="1" opacity="0.3"/>
    <text x="110" y="52" fill="#e2e8f0" font-size="18" font-weight="800" text-anchor="middle" letter-spacing="1">Rust Core Kernel</text>
    <text x="110" y="75" fill="#8892b0" font-size="13" font-weight="500" text-anchor="middle">Tauri System Daemon</text>
  </g>

  <!-- Right Node Top: WASM -->
  <g transform="translate(760, 40)">
    <rect width="200" height="70" rx="12" fill="#0b0f19" stroke="url(#neonGray)" stroke-width="2"/>
    <text x="100" y="32" fill="#e2e8f0" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1">Zero-Trust Sandbox</text>
    <text x="100" y="50" fill="#a8b2d1" font-size="12" text-anchor="middle">Extism WebAssembly</text>
  </g>

  <!-- Right Node Bottom: Soroban -->
  <g transform="translate(760, 170)">
    <rect width="200" height="70" rx="12" fill="#0b0f19" stroke="url(#neonCyan)" stroke-width="2"/>
    <text x="100" y="32" fill="#e2e8f0" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1">Soroban Network</text>
    <text x="100" y="50" fill="#64ffda" font-size="12" text-anchor="middle">Smart Contract Tx</text>
  </g>

  <!-- Connection: Front to Core -->
  <path d="M 240 140 L 390 140" stroke="#00d2ff" stroke-width="2" marker-end="url(#arrowCyan)" marker-start="url(#arrowCyan)"/>
  <rect x="265" y="128" width="100" height="24" rx="4" fill="#0f172a" stroke="#1e293b"/>
  <text x="315" y="144" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">Tauri IPC Local</text>

  <!-- Connection: Core to WASM -->
  <path d="M 610 110 L 760 75" stroke="#00d2ff" stroke-width="2" marker-end="url(#arrowCyan)" stroke-dasharray="4"/>
  <rect x="635" y="75" width="100" height="24" rx="4" fill="#0f172a" stroke="#1e293b"/>
  <text x="685" y="91" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">Isolated Logic</text>

  <!-- Connection: Core to Soroban -->
  <path d="M 610 170 L 760 205" stroke="#00d2ff" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <rect x="635" y="175" width="100" height="24" rx="4" fill="#0f172a" stroke="#1e293b"/>
  <text x="685" y="191" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">State Verify</text>

</svg>
